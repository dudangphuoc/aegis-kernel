; PgBouncer × Node cho Data Plane (modules auth, parties, audit).
; Control Plane / Migrator KHÔNG đi qua đây: DDL và pg_advisory_lock (session) cần kết nối trực tiếp :5432.
[databases]
; Wildcard: mọi database tenant (auth_<id>, parties_<id>, audit_<id>) được định tuyến động
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling: kết nối server chỉ bị giữ trong 1 transaction.
; Module chỉ dùng pg_advisory_xact_lock (theo transaction) và binary_parameters=yes (không prepared statement có tên).
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 15
min_pool_size = 0
reserve_pool_size = 5
max_db_connections = 40
server_idle_timeout = 300

; lib/pq gửi extra_float_digits khi khởi tạo kết nối
ignore_startup_parameters = extra_float_digits

admin_users = postgres
stats_users = postgres
log_connections = 0
log_disconnections = 0
