name: Go CI/CD Pipeline

# Tạm tắt tự chạy trên push/PR — chỉ chạy tay (Actions > Run workflow).
# Bật lại: thêm push/pull_request vào `on` và dựng Postgres + PgBouncer (services) cho integration test.
on:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # Integration test (modules/*, sdk/dbaudit) cần PostgreSQL :5432 — chưa có service nên chỉ chạy unit test
      - name: Unit Tests
        run: go test -race -cover ./core/... ./sdk ./sdk/multitenant/... ./sdk/security/... ./modules/audit/internal/ledger/...

      - name: Build Kernel & Modules
        run: make build-modules build-kernel
